[project]
name = "trader"
version = "0.1.0"
description = "Own-account trading system: SEC filings, quant + LLM signals, deterministic risk engine, human approval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "mcp>=1.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]

[project.scripts]
trader = "trader.cli:app"
trader-mcp = "trader.mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits real external services (SEC, ECB); skipped unless TRADER_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trader"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ib_async.*"]
ignore_missing_imports = true
